name: Build Android APK (arm64-v8a)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-rust:
    name: Rust Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run unit and integration tests
        run: cargo test --workspace --exclude app_android --exclude render_wgpu

      - name: Check full workspace compilation
        run: cargo check --workspace

  build-android-apk:
    name: Compile arm64-v8a Native Lib & Android APK
    runs-on: ubuntu-latest
    needs: test-rust
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 27.1.12297006
        run: |
          sdkmanager --install "ndk;27.1.12297006" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.1.12297006" >> $GITHUB_ENV

      - name: Install Rust toolchain (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust shared library (arm64-v8a)
        run: |
          mkdir -p android/app/src/main/jniLibs
          cargo ndk -t arm64-v8a -p 29 -o android/app/src/main/jniLibs build -p app_android --release

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Assemble Debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkbound-rooftops-arm64-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
